<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dylan — Portfolio</title>
  <meta name="description" content="Dylan's portfolio: AI films, images and campaigns.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/gallery.css">
</head>
<body>
  <!-- The drifting library. Tiles are added by gallery.js. -->
  <div id="stage" aria-hidden="true"><div id="wall"></div></div>

  <header class="bar">
    <a class="mark" href="/">DYLAN</a>
    <nav>
      <a href="/iceberg">The Iceberg</a>
      <a href="/blog">Logbook</a>
      <a href="/universe">Zoom out</a>
    </nav>
  </header>

  <!-- Always on screen: the way into the iceberg -->
  <a id="hero" href="/iceberg" aria-label="Enter the iceberg">
    <span class="hero-media"></span>
    <span class="hero-text">
      <span class="label">Enter</span>
      <strong>The Iceberg</strong>
    </span>
  </a>

  <footer class="bar bottom">
    <div id="archives" role="group" aria-label="Filter by archive"></div>
    <p class="hint">Click anything</p>
  </footer>

  <dialog id="viewer" aria-label="Viewer">
    <div class="viewer-media"></div>
    <div class="viewer-bar">
      <div><p class="label viewer-archive"></p><strong class="viewer-title"></strong></div>
      <div class="viewer-nav">
        <button type="button" data-step="-1" aria-label="Previous">←</button>
        <button type="button" data-step="1" aria-label="Next">→</button>
        <button type="button" class="viewer-close" aria-label="Close">✕</button>
      </div>
    </div>
  </dialog>

  <div id="whiteout" aria-hidden="true"></div>
  <script type="module" src="/js/gallery.js"></script>
</body>
</html>
